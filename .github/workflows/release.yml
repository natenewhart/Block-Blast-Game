name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # needed to create the release

jobs:
  release:
    runs-on: windows-2025-vs2026   # must provide the v145 toolset, see note below
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild "Block Blast Game.sln" /p:Configuration=Release /p:Platform=x64 /m

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $out = "bin/Release-x64/Block Blast Game"
          $exe = Get-ChildItem $out -Filter *.exe | Select-Object -First 1
          $pdb = Get-ChildItem $out -Filter *.pdb | Select-Object -First 1

          New-Item -ItemType Directory dist/game, dist/symbols -Force | Out-Null

          # Player zip: exe + res
          Copy-Item $exe.FullName dist/game/BlockBlast.exe
          Copy-Item "$out/res" dist/game/res -Recurse
          Compress-Archive dist/game/* "dist/BlockBlast-$tag.zip"

          # Symbols zip: pdb + the exact exe it matches
          Copy-Item $pdb.FullName dist/symbols/
          Copy-Item $exe.FullName dist/symbols/
          Compress-Archive dist/symbols/* "dist/BlockBlast-$tag-symbols.zip"

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true